    <!-- Hero Header -->
    <header class="hero">
        <canvas id="hero-canvas"></canvas>

        <div class="hero-content">
            <p class="hero-subtitle">Decoding the unseen dimensions</p>
            <div class="hero-brand">
                <h1 class="hero-main-title">APERIO</h1>

                    <span class="hero-line"></span>
                </div>
            </div>
            <div class="hero-button">
                <a href="https://forms.gle/F9evDGJCJm1P4XRz5" target="_blank" class="cta-button primary apply-btn">Apply my research</a>
            </div>
        </div>

        <div class="hero-footer">
            <div class="info-icon">i</div>

        </div>
    </header>

    <!-- Carousel Section -->
    <section class="carousel-section" id="carousel">
        <h2>Featured Explorations</h2>
        <div class="carousel-container">
            <button class="carousel-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="carousel-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
            
            <div class="carousel-track" id="track">
                <div class="carousel-slide">
                    <img src="slide1.png" alt="Xây dựng kế hoạch nghiên cứu">
                </div>
                <div class="carousel-slide">
                    <img src="slide2.png" alt="Lựa chọn đúng phương pháp nghiên cứu">
                </div>
                <div class="carousel-slide">
                    <img src="slide3.jpg" alt="Từ câu hỏi đến khoảng trống nghiên cứu">
                </div>
            </div>
        </div>

        <div class="carousel-indicators" id="indicators">
            <button class="indicator active" onclick="currentSlide(0)"></button>
            <button class="indicator" onclick="currentSlide(1)"></button>
            <button class="indicator" onclick="currentSlide(2)"></button>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="footer-content">
            <h3>Contact Us</h3>
            
            <div class="footer-links-row">
                <div class="footer-item">
                    <span>Fanpage:</span>
                    <a href="https://www.facebook.com/profile.php?id=61593208479696" class="footer-icon-link" aria-label="Facebook Fanpage">
                        <svg class="footer-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>

                <div class="footer-item">
                    <span>Apply your research:</span>
                    <a href="https://forms.gle/F9evDGJCJm1P4XRz5" class="footer-icon-link" aria-label="Apply Research">
                        <svg class="footer-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </a>
                </div>

            <p class="footer-contact-info">
                Phone: 090 934 8508 | Email: aperio.res@gmail.com

            <p class="footer-copyright">
                © 2026 AperioResearch. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        // Smooth navigation handler
        function scrollToSection(sectionId) {
            if (sectionId === 'hero') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Carousel Logic
        let currentIndex = 0;
        const track = document.getElementById('track');
        const slides = document.querySelectorAll('.carousel-slide');
        const indicators = document.querySelectorAll('.indicator');
        const totalSlides = slides.length;

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            indicators.forEach((ind, index) => {
                ind.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            currentIndex = (currentIndex + direction + totalSlides) % totalSlides;
            updateCarousel();
        }

        function currentSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        setInterval(() => {
            moveSlide(1);
        }, 5000);

        // Canvas 1: Home Page Comets & Constellations Animation
        const heroSectionEl = document.querySelector('.hero');
        const heroCanvas = document.getElementById('hero-canvas');
        const heroCtx = heroCanvas.getContext('2d');
        let heroW, heroH;

        function resizeHeroCanvas() {
            heroW = heroCanvas.width = heroSectionEl.clientWidth || window.innerWidth;
            heroH = heroCanvas.height = heroSectionEl.clientHeight || window.innerHeight;
        }
        window.addEventListener('resize', resizeHeroCanvas);
        resizeHeroCanvas();

        const homeStars = [];
        for (let i = 0; i < 110; i++) {
            homeStars.push({
                x: Math.random() * heroW,
                y: Math.random() * heroH,
                radius: Math.random() * 2.0 + 0.8,
                alpha: Math.random() * 0.7 + 0.3,
                vx: (Math.random() - 0.2) * 0.3,
                vy: (Math.random() - 0.2) * 0.3
            });
        }

        const comets = [];
        for (let i = 0; i < 8; i++) {
            comets.push({
                x: Math.random() * heroW * 1.5 - heroW * 0.25,
                y: Math.random() * heroH * 0.5 - 100,
                length: Math.random() * 320 + 200,
                speed: Math.random() * 2.5 + 1.8,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                width: Math.random() * 1.8 + 0.8,
                opacity: Math.random() * 0.5 + 0.3,
                color: Math.random() > 0.5 ? '255, 255, 255' : '167, 139, 250'
            });
        }

        // Interactive click effect arrays (declared BEFORE animateHero)
        const clickParticles = [];
        const clickRipples = [];

        function animateHero() {
            heroCtx.clearRect(0, 0, heroW, heroH);

            // 1. Constellation lines between nearby stars
            heroCtx.lineWidth = 0.8;
            for (let i = 0; i < homeStars.length; i++) {
                for (let j = i + 1; j < homeStars.length; j++) {
                    const dx = homeStars[i].x - homeStars[j].x;
                    const dy = homeStars[i].y - homeStars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 140) {
                        heroCtx.strokeStyle = `rgba(167, 139, 250, ${0.22 * (1 - dist / 140)})`;
                        heroCtx.beginPath();
                        heroCtx.moveTo(homeStars[i].x, homeStars[i].y);
                        heroCtx.lineTo(homeStars[j].x, homeStars[j].y);
                        heroCtx.stroke();
                    }
                }
            }

            // 2. Stars
            homeStars.forEach(star => {
                star.x += star.vx;
                star.y += star.vy;
                if (star.x < 0) star.x = heroW;
                if (star.x > heroW) star.x = 0;
                if (star.y < 0) star.y = heroH;
                if (star.y > heroH) star.y = 0;

                heroCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                heroCtx.beginPath();
                heroCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                heroCtx.fill();
            });

            // 3. Comets / Shooting stars
            comets.forEach(comet => {
                comet.x += Math.cos(comet.angle) * comet.speed;
                comet.y += Math.sin(comet.angle) * comet.speed;
                const tailX = comet.x - Math.cos(comet.angle) * comet.length;
                const tailY = comet.y - Math.sin(comet.angle) * comet.length;

                const grad = heroCtx.createLinearGradient(comet.x, comet.y, tailX, tailY);
                grad.addColorStop(0, `rgba(${comet.color}, ${comet.opacity})`);
                grad.addColorStop(1, `rgba(${comet.color}, 0)`);

                heroCtx.strokeStyle = grad;
                heroCtx.lineWidth = comet.width;
                heroCtx.beginPath();
                heroCtx.moveTo(comet.x, comet.y);
                heroCtx.lineTo(tailX, tailY);
                heroCtx.stroke();

                if (comet.x > heroW + 300 || comet.y > heroH + 300) {
                    comet.x = Math.random() * heroW * 1.2 - 200;
                    comet.y = -80;
                }
            });

            // Render interactive click particles & shockwave ripples
            for (let i = clickRipples.length - 1; i >= 0; i--) {
                const r = clickRipples[i];
                r.radius += r.speed;
                r.alpha -= r.fade;

                if (r.alpha <= 0) {
                    clickRipples.splice(i, 1);
                    continue;
                }

                heroCtx.save();
                heroCtx.beginPath();
                heroCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                heroCtx.strokeStyle = `rgba(${r.color}, ${r.alpha})`;
                heroCtx.lineWidth = r.width;
                heroCtx.stroke();
                heroCtx.restore();
            }

            for (let i = clickParticles.length - 1; i >= 0; i--) {
                const p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.alpha -= p.fade;

                if (p.alpha <= 0) {
                    clickParticles.splice(i, 1);
                    continue;
                }

                heroCtx.save();
                heroCtx.beginPath();
                heroCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                heroCtx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                heroCtx.shadowBlur = 10;
                heroCtx.shadowColor = `rgba(${p.color}, 0.8)`;
                heroCtx.fill();
                heroCtx.restore();
            }

            requestAnimationFrame(animateHero);
        }
        animateHero();

        // Mouse click interaction handler
        function handleHeroClick(e) {
            // Ignore clicks directly on interactive elements like links or buttons
            if (e.target.closest('a') || e.target.closest('button')) return;

            const rect = heroCanvas.getBoundingClientRect();
            // Only trigger if click is within the hero section
            if (e.clientY < rect.top || e.clientY > rect.bottom) return;

            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // 1. Shockwave ripples
            clickRipples.push({
                x: clickX,
                y: clickY,
                radius: 10,
                speed: 5.0,
                alpha: 0.9,
                fade: 0.015,
                width: 2.5,
                color: '139, 92, 246' // Purple
            });
            clickRipples.push({
                x: clickX,
                y: clickY,
                radius: 5,
                speed: 3.2,
                alpha: 0.75,
                fade: 0.012,
                width: 1.5,
                color: '45, 212, 191' // Teal
            });

            // 2. Exploding spark particles
            const colors = ['255, 255, 255', '167, 139, 250', '192, 132, 252', '45, 212, 191'];
            const count = 26;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5;
                const speed = Math.random() * 5.5 + 2.5;
                clickParticles.push({
                    x: clickX,
                    y: clickY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 2.8 + 1.2,
                    alpha: 1.0,
                    fade: Math.random() * 0.02 + 0.015,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            // 3. Shockwave impulse to nearby stars
            homeStars.forEach(star => {
                const dx = star.x - clickX;
                const dy = star.y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 220 && dist > 0) {
                    const force = (220 - dist) / 220 * 5.0;
                    star.vx += (dx / dist) * force * 0.35;
                    star.vy += (dy / dist) * force * 0.35;
                    star.alpha = 1.0;
                }
            });
        }

        window.addEventListener('click', handleHeroClick);
    </script>
</body>
