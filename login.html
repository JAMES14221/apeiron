<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Aperio Research</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to your Aperio Research account</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Nhúng thư viện Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. Khởi tạo kết nối Supabase
        const SUPABASE_URL = "https://ryybxrcjanpgozlswlkp.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5eWJ4cmNqYW5wZ296bHN3bGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNTc5NjIsImV4cCI6MjEwMzYzMzk2Mn0.lFfrQBQcBl7Qx2663H39RWheuyoHiBrlT5t0701nfTQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Lấy Form đăng nhập
        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 3. Xử lý đăng nhập với Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Đăng nhập thất bại: ' + error.message);
            } else {
                alert('Đăng nhập thành công!');
                window.location.href = 'index.html'; // Chuyển về trang chủ sau khi đăng nhập thành công
            }
        });
    </script>
</body>
</html>
